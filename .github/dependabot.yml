version: 2

updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 5
    groups:
      server-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
    open-pull-requests-limit: 5
    groups:
      client-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major upgrades for these packages are coordinated migrations, not
      # drop-in bumps. Opening them one package at a time produces PRs that
      # cannot install (for example react-dom 19 without react 19, or
      # @vitejs/plugin-react 6 without Vite 8). Upgrade these together in a
      # dedicated, tested PR.
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint-plugin-react"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /client
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /server/database
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
    open-pull-requests-limit: 3
