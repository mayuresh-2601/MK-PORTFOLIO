name: CI/CD Pipeline

# ─────────────────────────────────────────────────────────────
# Continuous integration + automatic deployment.
#
#   pull_request  → hygiene, lint, unit tests, client build, full Docker stack
#   push to main  → all of the above, then deploy the API to Render and run
#                   production smoke tests against Render + Vercel.
#   manual        → workflow_dispatch (same as a main push)
#
# The frontend deploys itself through Vercel's native Git integration.
# The API deploy uses the Render REST API because Render's GitHub App is
# not installed on this repository.
#
# Required repository configuration:
#   secret   RENDER_API_KEY      Render API key (Account Settings → API Keys)
#   variable RENDER_SERVICE_ID   optional, defaults to the live service below
#   variable PRODUCTION_API_URL  optional, defaults to the live API below
#   variable PRODUCTION_SITE_URL optional, defaults to the live site below
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let main deploys finish in order; only supersede stale pull-request runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://mk-portfolio-api.onrender.com' }}
  PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || 'https://mk-portfolio-phi-silk.vercel.app' }}
  RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID || 'srv-dbpcjf6gekts73aoovng' }}

jobs:
  repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Ensure No Secrets or Build Output Are Tracked
        run: |
          set -euo pipefail

          BAD=$(git ls-files | grep -E \
            '(^|/)\.env$|(^|/)node_modules/|(^|/)(dist|build|coverage)/|\.(log|pem|key)$|(^|/)\.vercel/' \
            || true)

          if [ -n "$BAD" ]; then
            echo "::error::These generated or secret files must not be tracked:"
            echo "$BAD"
            exit 1
          fi

          for TEMPLATE in .env.example client/.env.example server/.env.example; do
            if [ ! -f "$TEMPLATE" ]; then
              echo "::error::Missing environment template: $TEMPLATE"
              exit 1
            fi
          done

          echo "Repository is clean and all environment templates are present."

  server-checks:
    name: Server Syntax & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci

      - name: Check Server Syntax
        working-directory: server
        run: npm run check

      - name: Run Server Tests
        working-directory: server
        run: npm test

  client-checks:
    name: Client Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Lint Client
        working-directory: client
        run: npm run lint

      - name: Build Client
        working-directory: client
        env:
          VITE_API_BASE_URL: ${{ env.PRODUCTION_API_URL }}
        run: npm run build

      - name: Verify Build Output
        working-directory: client
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -d dist/assets

          if ! grep -q '<div id="root"></div>' dist/index.html; then
            echo "::error::dist/index.html does not contain the React root element."
            exit 1
          fi

          # Every public route ships its own title, description and canonical
          # URL, so the built bundle must contain the per-page SEO metadata.
          for MARKER in \
            "About Mayuresh Kasar | Full Stack Developer" \
            "Technical Skills | Mayuresh Kasar" \
            "Projects | Mayuresh Kasar" \
            "Certificates | Mayuresh Kasar" \
            "Live System Metrics | Mayuresh Kasar" \
            "Contact Mayuresh Kasar | Hire a Full Stack Developer"
          do
            if ! grep -rqF "$MARKER" dist/assets; then
              echo "::error::Built bundle is missing the page metadata: $MARKER"
              exit 1
            fi
          done

          echo "Client build output is valid."

  dockerfile-lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Lint Server Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: server/Dockerfile
          # Warnings and errors fail the build. Style/info hints are printed
          # but never block a deployment.
          failure-threshold: warning

      - name: Lint Client Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: client/Dockerfile
          failure-threshold: warning

  docker-stack:
    name: Build & Test Full Stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [repo-hygiene, server-checks, client-checks, dockerfile-lint]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # docker-compose.yml requires server/.env (via env_file) and a root
      # .env (for ${DB_PASSWORD} / ${DB_NAME} substitution). Both are
      # gitignored, so this step generates CI-only values. They are never
      # used outside this workflow run.
      - name: Create CI Environment Files
        run: |
          set -euo pipefail
          umask 077

          cat > server/.env <<'EOF'
          PORT=5000
          HOST=0.0.0.0
          CLIENT_URL=http://localhost

          DB_HOST=db
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=ci_test_password
          DB_NAME=portfolio_ci

          # The CI database is a local container with a self-signed cert,
          # not TiDB Cloud's CA-signed endpoint.
          DB_SSL=false

          # 48 characters — production validation requires at least 32.
          JWT_SECRET=ci_test_jwt_secret_0123456789abcdef0123456789

          # CI-only admin identity. Never used in a real deployment.
          ADMIN_EMAIL=ci-admin@portfolio.test
          ADMIN_PASSWORD=ci_test_password_2026!
          EOF

          # Cloudinary, Gmail and Gemini are intentionally unset so CI also
          # proves the API boots and serves content without those integrations.

          cat > .env <<'EOF'
          DB_PASSWORD=ci_test_password
          DB_NAME=portfolio_ci
          EOF

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build

      - name: Verify Images Exclude Secrets
        run: |
          docker compose run --rm --no-deps --entrypoint sh server -c \
            "if [ -f /app/.env ]; then echo 'server/.env was baked into the image'; exit 1; fi; echo 'No .env file in server image.'"

      - name: Start Containers
        run: docker compose up -d

      - name: Wait for Services
        run: |
          set -euo pipefail
          echo "Waiting for the API and database..."

          for i in $(seq 1 24); do
            # /api/health/ready only returns 200 once MySQL answers, so it
            # proves the full server -> database path, not just the process.
            if curl -fsS --max-time 5 http://localhost:5000/api/health/ready > /dev/null; then
              echo "Backend and database are ready."
              exit 0
            fi

            echo "Waiting... ($i/24)"
            sleep 5
          done

          echo "::error::Backend did not become ready in time."
          docker compose ps
          docker compose logs server db
          exit 1

      # Proves schema.sql/seed.sql work with an arbitrary database name and
      # contain no hardcoded `USE portfolio`. This is the exact bug that made
      # every earlier CI run fail with "Table 'portfolio_ci.projects' doesn't exist".
      - name: Test SQL Against an Arbitrary Database Name
        run: |
          set -euo pipefail

          docker compose exec -T -e MYSQL_PWD=ci_test_password db \
            mysql -uroot -e \
            "CREATE DATABASE portfolio_alt CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

          docker compose exec -T db sh -c \
            'MYSQL_PWD=ci_test_password mysql -uroot portfolio_alt < /docker-entrypoint-initdb.d/schema.sql'

          docker compose exec -T db sh -c \
            'MYSQL_PWD=ci_test_password mysql -uroot portfolio_alt < /docker-entrypoint-initdb.d/seed.sql'

          for TABLE in projects skills certificates messages; do
            COUNT=$(docker compose exec -T -e MYSQL_PWD=ci_test_password db \
              mysql -uroot -N -B -e "SELECT COUNT(*) FROM portfolio_alt.${TABLE};" | tr -d '\r')

            echo "portfolio_alt.${TABLE}: ${COUNT} row(s)"
          done

          PROJECTS=$(docker compose exec -T -e MYSQL_PWD=ci_test_password db \
            mysql -uroot -N -B -e "SELECT COUNT(*) FROM portfolio_alt.projects;" | tr -d '\r')

          if [ "$PROJECTS" -lt 4 ]; then
            echo "::error::Expected at least 4 seeded projects, found ${PROJECTS}."
            exit 1
          fi

          echo "SQL files are database-name independent."

      - name: Verify Database Schema
        run: docker compose exec -T server npm run db:check

      - name: Test Backend API
        run: |
          set -euo pipefail

          for ENDPOINT in /api/health /api/health/ready /api/projects /api/skills /api/certificates /api/system; do
            STATUS=$(curl \
              --write-out "%{http_code}" \
              --silent \
              --output /dev/null \
              "http://localhost:5000${ENDPOINT}")

            if [ "$STATUS" != "200" ]; then
              echo "::error::${ENDPOINT} failed (${STATUS})"
              docker compose logs server
              exit 1
            fi

            echo "${ENDPOINT} OK (200)"
          done

          # Seed data must be visible through the API, not just present in SQL.
          for PAIR in projects:4 skills:16 certificates:16; do
            RESOURCE=${PAIR%%:*}
            MINIMUM=${PAIR##*:}
            COUNT=$(curl -fsS "http://localhost:5000/api/${RESOURCE}" | jq -r '.count')

            if [ "$COUNT" -lt "$MINIMUM" ]; then
              echo "::error::/api/${RESOURCE} returned ${COUNT} rows, expected at least ${MINIMUM}."
              exit 1
            fi

            echo "/api/${RESOURCE} returned ${COUNT} rows."
          done

          # Malformed JSON must return 400 (not 500) from the error middleware.
          MALFORMED_STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{bad json' \
            http://localhost:5000/api/messages)

          if [ "$MALFORMED_STATUS" != "400" ]; then
            echo "::error::Malformed JSON returned ${MALFORMED_STATUS}, expected 400"
            exit 1
          fi

          echo "Malformed JSON handled with 400."

          FIELD_TYPE_STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"name":123,"email":"a@b.com","message":"hi"}' \
            http://localhost:5000/api/messages)

          if [ "$FIELD_TYPE_STATUS" != "400" ]; then
            echo "::error::Wrong field type returned ${FIELD_TYPE_STATUS}, expected 400"
            exit 1
          fi

          echo "Wrong field type handled with 400."

      - name: Test Admin Authentication
        run: |
          set -euo pipefail

          LOGIN_STATUS=$(curl \
            --silent \
            --output /tmp/login.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"email":"ci-admin@portfolio.test","password":"ci_test_password_2026!"}' \
            http://localhost:5000/api/auth/login)

          if [ "$LOGIN_STATUS" != "200" ]; then
            echo "::error::Admin login failed (${LOGIN_STATUS})"
            cat /tmp/login.json
            docker compose logs server
            exit 1
          fi

          TOKEN=$(jq -r '.token' /tmp/login.json)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Login response did not include a token."
            exit 1
          fi

          for ROUTE in messages projects skills certificates; do
            PROTECTED_STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${TOKEN}" \
              "http://localhost:5000/api/${ROUTE}")

            if [ "$PROTECTED_STATUS" != "200" ]; then
              echo "::error::Protected route /api/${ROUTE} rejected the token (${PROTECTED_STATUS})."
              exit 1
            fi
          done

          WRONG_STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"email":"ci-admin@portfolio.test","password":"wrong-password"}' \
            http://localhost:5000/api/auth/login)

          if [ "$WRONG_STATUS" != "401" ]; then
            echo "::error::Wrong password was not rejected with 401 (${WRONG_STATUS})"
            exit 1
          fi

          WRONG_EMAIL_STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"email":"someone@else.com","password":"ci_test_password_2026!"}' \
            http://localhost:5000/api/auth/login)

          if [ "$WRONG_EMAIL_STATUS" != "401" ]; then
            echo "::error::Wrong email was not rejected with 401 (${WRONG_EMAIL_STATUS})"
            exit 1
          fi

          echo "Admin authentication OK."

      - name: Test Admin Update Endpoints
        run: |
          set -euo pipefail

          TOKEN=$(jq -r '.token' /tmp/login.json)

          # --- skills ---
          SKILL_ID=$(curl -fsS \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${TOKEN}" \
            --data '{"name":"CI Update Skill","level":50}' \
            http://localhost:5000/api/skills | jq -r '.id')

          if [ -z "$SKILL_ID" ]; then
            echo "::error::Could not create the skill used for the update test."
            exit 1
          fi

          NOAUTH_STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request PUT \
            --header "Content-Type: application/json" \
            --data '{"name":"Hijacked","level":1}' \
            "http://localhost:5000/api/skills/${SKILL_ID}")

          if [ "$NOAUTH_STATUS" != "401" ]; then
            echo "::error::Unauthenticated skill update returned ${NOAUTH_STATUS}, expected 401."
            exit 1
          fi

          UPDATE_STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request PUT \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${TOKEN}" \
            --data '{"name":"CI Updated Skill","level":55}' \
            "http://localhost:5000/api/skills/${SKILL_ID}")

          if [ "$UPDATE_STATUS" != "200" ]; then
            echo "::error::Skill update returned ${UPDATE_STATUS}, expected 200."
            exit 1
          fi

          UPDATED_NAME=$(curl -fsS http://localhost:5000/api/skills \
            | jq -r ".data[] | select(.id == ${SKILL_ID}) | .name")

          if [ "$UPDATED_NAME" != "CI Updated Skill" ]; then
            echo "::error::Skill update did not persist (found: ${UPDATED_NAME})."
            exit 1
          fi

          curl -fsS \
            --request DELETE \
            --header "Authorization: Bearer ${TOKEN}" \
            "http://localhost:5000/api/skills/${SKILL_ID}" > /dev/null

          echo "Skill update OK."

          # --- certificates ---
          CERT_ID=$(curl -fsS \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${TOKEN}" \
            --data '{"title":"CI Update Certificate","issuer":"Audit","link":"https://example.com/ci"}' \
            http://localhost:5000/api/certificates | jq -r '.id')

          if [ -z "$CERT_ID" ]; then
            echo "::error::Could not create the certificate used for the update test."
            exit 1
          fi

          CERT_STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request PUT \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${TOKEN}" \
            --data '{"title":"CI Renamed Certificate","issuer":"Audit","link":"https://example.com/ci"}' \
            "http://localhost:5000/api/certificates/${CERT_ID}")

          if [ "$CERT_STATUS" != "200" ]; then
            echo "::error::Certificate update returned ${CERT_STATUS}, expected 200."
            exit 1
          fi

          CERT_TITLE=$(curl -fsS http://localhost:5000/api/certificates \
            | jq -r ".data[] | select(.id == ${CERT_ID}) | .title")

          if [ "$CERT_TITLE" != "CI Renamed Certificate" ]; then
            echo "::error::Certificate update did not persist (found: ${CERT_TITLE})."
            exit 1
          fi

          curl -fsS \
            --request DELETE \
            --header "Authorization: Bearer ${TOKEN}" \
            "http://localhost:5000/api/certificates/${CERT_ID}" > /dev/null

          echo "Certificate update OK."

          # --- projects (update an existing seeded project, then restore it) ---
          PROJECT_ID=$(curl -fsS http://localhost:5000/api/projects | jq -r '.data[0].id')
          PROJECT_TITLE=$(curl -fsS http://localhost:5000/api/projects | jq -r '.data[0].title')

          curl -fsS \
            --request PUT \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${TOKEN}" \
            --data '{"title":"CI Renamed Project"}' \
            "http://localhost:5000/api/projects/${PROJECT_ID}" > /dev/null

          RENAMED=$(curl -fsS http://localhost:5000/api/projects \
            | jq -r ".data[] | select(.id == ${PROJECT_ID}) | .title")

          if [ "$RENAMED" != "CI Renamed Project" ]; then
            echo "::error::Project update did not persist (found: ${RENAMED})."
            exit 1
          fi

          # Restore the original title so the seeded content stays untouched.
          curl -fsS \
            --request PUT \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${TOKEN}" \
            --data "$(jq -nc --arg title "${PROJECT_TITLE}" '{title: $title}')" \
            "http://localhost:5000/api/projects/${PROJECT_ID}" > /dev/null

          echo "Project update OK."

      - name: Test Frontend
        run: |
          set -euo pipefail

          for URL in http://localhost/ http://localhost/projects http://localhost/admin; do
            STATUS=$(curl \
              --write-out "%{http_code}" \
              --silent \
              --output /dev/null \
              "$URL")

            if [ "$STATUS" != "200" ]; then
              echo "::error::${URL} failed (${STATUS})"
              docker compose logs client
              exit 1
            fi

            echo "${URL} OK (200)"
          done

          # Nginx must proxy /api to Express, not serve index.html.
          PROXY_STATUS=$(curl \
            --write-out "%{http_code}" \
            --silent \
            --output /dev/null \
            http://localhost/api/health)

          if [ "$PROXY_STATUS" != "200" ]; then
            echo "::error::Nginx /api proxy failed (${PROXY_STATUS})"
            docker compose logs client server
            exit 1
          fi

          echo "Nginx /api proxy OK (200)."

          HEADERS=$(curl --silent --show-error --head http://localhost/)

          for HEADER in \
            "Content-Security-Policy" \
            "X-Frame-Options" \
            "X-Content-Type-Options" \
            "Referrer-Policy" \
            "Permissions-Policy"
          do
            if ! echo "$HEADERS" | grep -qi "^${HEADER}:"; then
              echo "::error::Missing security header: ${HEADER}"
              exit 1
            fi
          done

          if echo "$HEADERS" | grep -qi "^Server:.*nginx/[0-9]"; then
            echo "::error::Nginx version is exposed in the Server header."
            exit 1
          fi

          echo "Frontend security headers OK."

      - name: Collect Docker Logs
        if: failure()
        run: |
          mkdir -p logs
          docker compose ps > logs/compose-ps.log || true
          docker compose logs --no-color > logs/docker.log || true

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop Containers
        if: always()
        run: docker compose down -v

  deploy-api:
    name: Deploy API to Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [repo-hygiene, server-checks, client-checks, dockerfile-lint, docker-stack]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # Full history lets us prove the deployed commit belongs to this branch.
          fetch-depth: 0

      - name: Validate Render Credentials
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "${RENDER_API_KEY}" ]; then
            echo "::error::RENDER_API_KEY is not configured. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          if [ -z "${RENDER_SERVICE_ID}" ]; then
            echo "::error::RENDER_SERVICE_ID is empty."
            exit 1
          fi

      - name: Trigger Render Deploy
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl -fsS \
            --request POST \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"${GITHUB_SHA}\"}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")

          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Render did not return a deploy id."
            echo "$RESPONSE"
            exit 1
          fi

          echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
          echo "Triggered Render deploy ${DEPLOY_ID} for ${GITHUB_SHA}."

      - name: Wait for Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail

          for i in $(seq 1 80); do
            RESPONSE=$(curl -fsS \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}")

            STATUS=$(echo "$RESPONSE" | jq -r '.status')
            echo "Render deploy status: ${STATUS} (${i}/80)"

            case "$STATUS" in
              live)
                DEPLOYED_SHA=$(echo "$RESPONSE" | jq -r '.commit.id // empty')

                if [ -n "$DEPLOYED_SHA" ]; then
                  if git merge-base --is-ancestor "$GITHUB_SHA" "$DEPLOYED_SHA" 2>/dev/null || \
                     git merge-base --is-ancestor "$DEPLOYED_SHA" "$GITHUB_SHA" 2>/dev/null; then
                    echo "Deployed commit ${DEPLOYED_SHA:0:7} is on this branch."
                  else
                    echo "::error::Deployed commit ${DEPLOYED_SHA:0:7} is unrelated to ${GITHUB_SHA:0:7}."
                    exit 1
                  fi

                  echo "### API deployed" >> "$GITHUB_STEP_SUMMARY"
                  echo "- Commit: \`${DEPLOYED_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "- Deploy: \`${DEPLOY_ID}\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "- URL: ${PRODUCTION_API_URL}" >> "$GITHUB_STEP_SUMMARY"
                fi

                exit 0
                ;;

              build_failed|pre_deploy_failed|update_failed|canceled|deactivated)
                echo "::error::Render deploy ended with status ${STATUS}."
                echo "$RESPONSE" | jq .
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "::error::Timed out waiting for Render deploy ${DEPLOY_ID}."
          exit 1

  production-smoke:
    name: Production Smoke Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-api]

    steps:
      - name: Wait for Production API
        run: |
          set -euo pipefail

          # Render's free tier spins down when idle; the first request can
          # take up to a minute while the instance resumes.
          for i in $(seq 1 36); do
            if curl -fsS --max-time 60 "${PRODUCTION_API_URL}/api/health" > /dev/null; then
              echo "API is healthy."
              exit 0
            fi

            echo "Waiting for API... (${i}/36)"
            sleep 10
          done

          echo "::error::Production API did not become healthy."
          exit 1

      - name: Verify API Readiness and Content
        run: |
          set -euo pipefail

          READY=$(curl -fsS --max-time 60 "${PRODUCTION_API_URL}/api/health/ready")
          echo "$READY" | jq -e '.success == true and .database == "connected"'

          for PAIR in projects:4 skills:16 certificates:16; do
            RESOURCE=${PAIR%%:*}
            MINIMUM=${PAIR##*:}
            BODY=$(curl -fsS --max-time 60 "${PRODUCTION_API_URL}/api/${RESOURCE}")
            COUNT=$(echo "$BODY" | jq -r '.count')
            MISSING=$(echo "$BODY" | jq -r '[.data[] | select((.title // .name // "") == "")] | length')

            if [ "$COUNT" -lt "$MINIMUM" ]; then
              echo "::error::/api/${RESOURCE} returned ${COUNT} rows, expected at least ${MINIMUM}."
              exit 1
            fi

            if [ "$MISSING" -gt 0 ]; then
              echo "::error::/api/${RESOURCE} returned ${MISSING} rows without a title/name."
              exit 1
            fi

            echo "/api/${RESOURCE}: ${COUNT} rows, all named."
          done

          SYSTEM=$(curl -fsS --max-time 60 "${PRODUCTION_API_URL}/api/system")
          NODE_VERSION=$(echo "$SYSTEM" | jq -r '.data.host.nodeVersion')

          case "$NODE_VERSION" in
            v22.*) echo "Production Node.js: ${NODE_VERSION}" ;;
            *) echo "::error::Production is running Node ${NODE_VERSION}, expected v22.x."; exit 1 ;;
          esac

      - name: Verify Production Auth and CORS
        run: |
          set -euo pipefail

          WRONG_PASSWORD_STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 60 \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"email":"not-the-admin@example.com","password":"definitely-wrong"}' \
            "${PRODUCTION_API_URL}/api/auth/login")

          if [ "$WRONG_PASSWORD_STATUS" != "401" ]; then
            echo "::error::Wrong production credentials returned ${WRONG_PASSWORD_STATUS}, expected 401."
            exit 1
          fi

          echo "Production admin auth rejects invalid credentials."

          CORS_HEADERS=$(curl \
            --silent \
            --show-error \
            --dump-header - \
            --output /dev/null \
            --max-time 60 \
            --request OPTIONS \
            --header "Origin: ${PRODUCTION_SITE_URL}" \
            --header "Access-Control-Request-Method: GET" \
            "${PRODUCTION_API_URL}/api/projects")

          if ! echo "$CORS_HEADERS" | grep -qi "^access-control-allow-origin: ${PRODUCTION_SITE_URL}"; then
            echo "::error::CORS preflight did not allow ${PRODUCTION_SITE_URL}."
            echo "$CORS_HEADERS"
            exit 1
          fi

          echo "Production CORS allows the Vercel origin."

      - name: Verify Production Frontend
        run: |
          set -euo pipefail

          # Vercel deploys from the same push; allow its build a few minutes.
          HOME_STATUS=""
          for i in $(seq 1 30); do
            HOME_STATUS=$(curl \
              --silent \
              --output /tmp/home.html \
              --write-out "%{http_code}" \
              --max-time 60 \
              "${PRODUCTION_SITE_URL}/" || true)

            if [ "$HOME_STATUS" = "200" ] && grep -q '<div id="root"></div>' /tmp/home.html; then
              echo "Frontend is live."
              break
            fi

            echo "Waiting for Vercel deployment... (${i}/30)"
            sleep 10
            HOME_STATUS=""
          done

          if [ -z "$HOME_STATUS" ]; then
            echo "::error::Production frontend did not become available."
            exit 1
          fi

          for ROUTE in / /projects /skills /certificates /system /contact /admin /this-route-does-not-exist; do
            STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 60 \
              "${PRODUCTION_SITE_URL}${ROUTE}")

            if [ "$STATUS" != "200" ]; then
              echo "::error::${ROUTE} returned ${STATUS}, expected 200 (SPA fallback)."
              exit 1
            fi

            echo "${ROUTE} OK (200)"
          done

          HEADERS=$(curl --silent --show-error --head --max-time 60 "${PRODUCTION_SITE_URL}/")

          for HEADER in \
            "content-security-policy" \
            "x-frame-options" \
            "x-content-type-options" \
            "referrer-policy" \
            "permissions-policy" \
            "strict-transport-security"
          do
            if ! echo "$HEADERS" | grep -qi "^${HEADER}:"; then
              echo "::error::Missing production security header: ${HEADER}"
              exit 1
            fi
          done

          echo "Production security headers OK."

      - name: Verify SEO Files
        run: |
          set -euo pipefail

          ROBOTS=$(curl -fsS --max-time 60 "${PRODUCTION_SITE_URL}/robots.txt")
          SITEMAP=$(curl -fsS --max-time 60 "${PRODUCTION_SITE_URL}/sitemap.xml")

          echo "$ROBOTS" | grep -q "Sitemap: ${PRODUCTION_SITE_URL}/sitemap.xml" \
            || { echo "::error::robots.txt is missing the production sitemap URL."; exit 1; }

          echo "$SITEMAP" | grep -q "${PRODUCTION_SITE_URL}" \
            || { echo "::error::sitemap.xml does not contain the production URL."; exit 1; }

          echo "robots.txt and sitemap.xml point at production."
