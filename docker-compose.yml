services:
  
  # MySQL Database
  
  db:
    # Schema and seed are baked into this image. Bind-mounting individual
    # files fails on Windows Docker Desktop when the project is on a
    # removable drive, because the mount points appear as directories.
    build:
      context: ./server/database
      dockerfile: Dockerfile
    image: portfolio-app-db:local

    restart: unless-stopped

    # Only the two values MySQL needs. Never mount server/.env into the
    # database container: it also contains the admin password, MFA secret,
    # Gmail tokens and Cloudinary keys.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      # Loopback only: the database must never be reachable from the LAN.
      - "127.0.0.1:3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    # Force TCP so the check does not pass against MySQL's temporary
    # socket-only server while the init scripts are still running. The
    # temporary server uses `port: 0`, so 127.0.0.1 is refused until the
    # real server is ready to accept application connections.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 --protocol=TCP -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    security_opt:
      - no-new-privileges:true

    networks:
      - db_net

  
  # Express Backend
  
  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    env_file:
      - ./server/.env

    # Point the API at the local `db` service regardless of what
    # server/.env says (that file may target TiDB Cloud for local dev).
    # DB_SSL must be false because this MySQL container uses a
    # self-signed cert. The session cookie override is for local HTTP only;
    # production (Render) must use a Secure cookie.
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: "false"
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: "lax"

    ports:
      - "5000:5000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:5000/api/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    # The app writes nothing to disk; uploads are streamed to Cloudinary and
    # logs go to stdout. A read-only filesystem limits post-exploitation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    networks:
      - portfolio_net
      - db_net

  
  # React + Nginx
  
  client:
    build:
      context: ./client
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    ports:
      # Host port 80 is unchanged for users; the container listens on the
      # unprivileged port 8080.
      - "80:8080"

    depends_on:
      server:
        condition: service_healthy

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    networks:
      - portfolio_net

  # Optional malware scanner. Start it with:
  #   docker compose --profile scanning up -d clamav
  # then set CLAMAV_HOST=clamav in server/.env and restart the API. It stays
  # off by default because definition downloads are large and slow.
  clamav:
    image: clamav/clamav:stable
    profiles:
      - scanning
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    networks:
      - portfolio_net


# Persistent Volumes

volumes:
  mysql_data:


# Networks

networks:
  portfolio_net:
    driver: bridge

  # The database is reachable only by the API container. It has no route to
  # the internet and the client container cannot resolve it.
  db_net:
    driver: bridge
    internal: true
