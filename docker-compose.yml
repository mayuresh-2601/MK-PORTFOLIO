services:
  
  # MySQL Database
  
  db:
    image: mysql:8.0

    restart: unless-stopped

    # Only the two values MySQL needs. Never mount server/.env into the
    # database container: it also contains the JWT secret, admin password,
    # Gmail tokens and Cloudinary keys.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      # MySQL runs these files alphabetically: schema.sql, then seed.sql.
      # A fresh `docker compose up` therefore has the real portfolio content.
      - ./server/database/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro

    # Force TCP so the check does not pass against MySQL's temporary
    # socket-only server while the init scripts are still running. The
    # temporary server uses `port: 0`, so 127.0.0.1 is refused until the
    # real server is ready to accept application connections.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 --protocol=TCP -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    networks:
      - portfolio_net

  
  # Express Backend
  
  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./server/.env

    # Point the API at the local `db` service regardless of what
    # server/.env says (that file may target TiDB Cloud for local dev).
    # DB_SSL must be false because this MySQL container uses a
    # self-signed cert.
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: "false"

    ports:
      - "5000:5000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:5000/api/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - portfolio_net

  
  # React + Nginx
  
  client:
    build:
      context: ./client
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      server:
        condition: service_healthy

    networks:
      - portfolio_net


# Persistent Volumes

volumes:
  mysql_data:


# Networks

networks:
  portfolio_net:
    driver: bridge
