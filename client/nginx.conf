server {
    listen 80;
    server_name localhost;

    # Do not advertise the exact nginx version.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ==========================
    # Security Headers
    # ==========================
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Inline style attributes are used by React; scripts stay self-only.
    # upgrade-insecure-requests is intentionally omitted so the local Docker
    # preview on http://localhost keeps working.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https:" always;

    # ==========================
    # Gzip Compression
    # ==========================
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # ==========================
    # React SPA Routing
    # ==========================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the SPA shell so a new deployment is picked up.
    # `expires` does not disable the server-level add_header directives.
    location = /index.html {
        expires -1;
    }

    # ==========================
    # Static Asset Cache
    # ==========================
    location /assets/ {
        expires 1y;
        # A child location that uses add_header stops inheriting the
        # server-level headers, so keep the critical one here too.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ==========================
    # API Reverse Proxy
    # ==========================
    location /api/ {
        proxy_pass http://server:5000/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;
    }

    # ==========================
    # File Upload Limit
    # ==========================
    client_max_body_size 20M;

    # ==========================
    # Error Pages
    # ==========================
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}